name: 'Setup'
description: 'Setup Node and install dependencies'
inputs:
  node-version:
    description: 'Version of Node to use'
    type: string
    required: true
    default: 'lts/*'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
    - name: Install dependencies
      run: npm ci
      shell: bash
