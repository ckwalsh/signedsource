name: PR for main
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ['*', 'lts/*', 'lts/-1', 'lts/-2']
    uses: ./.github/workflows/build-and-test.yml
    with:
      node-version: ${{ matrix.node-version }}
