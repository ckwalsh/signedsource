name: 'Build and Test'
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: 'lts/*'
jobs:
  build-and-test:
    runs-on: homelab
    name: Test on Node ${{ inputs.node-version }}
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
      - uses: ./.github/actions/test
      - uses: ./.github/actions/build
