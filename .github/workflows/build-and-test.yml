name: Build and Test
on: [workflow_call]
jobs:
  build-and-test:
    runs-on: homelab
    strategy:
      fail-fast: false
      matrix:
        node-version: ['*', 'lts/*', 'lts/-1', 'lts/-2']
    name: Test on Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - uses: ./.github/actions/test
      - uses: ./.github/actions/build
