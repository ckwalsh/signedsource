name: 'Build and Test'
 
on: ['pull_request', 'push']
 
jobs:
  test:
    runs-on: homelab
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - run: |
          npm ci
          npm run typecheck
          npm run build
          npm test